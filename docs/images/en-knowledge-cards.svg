<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">Knowledge cards: understand, then return</title><desc id="desc">A concept explained in context, with a clear route back to the paper. Example concept only; selection depends on the paper and its readers.</desc>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<rect x="0" y="0" width="1440" height="960" rx="24" fill="#f5f5ef" stroke="#f5f5ef"/>
<text x="52" y="55" font-size="18" fill="#65766d" font-weight="600">PAPER TO HTML  /  02</text>
<text x="52" y="109" font-size="38" fill="#203b35" font-weight="700">Knowledge cards: understand, then return</text>
<text x="52" y="155" font-size="23" fill="#65766d" font-weight="400">A concept explained in context, with a clear route back to the paper.</text>
<rect x="52" y="215" width="465" height="602" rx="14" fill="white" stroke="#d4ddd2"/><rect x="555" y="215" width="833" height="602" rx="14" fill="white" stroke="#d4ddd2"/><circle cx="99" cy="260" r="17" fill="#315f4d"/><text x="93" y="266" font-size="18" fill="white" font-weight="600">1</text><text x="128" y="269" font-size="24" fill="#315f4d" font-weight="600">Read the paper</text><text x="82" y="330" font-size="24" fill="#203b35" font-weight="400">The two groups are compared</text><text x="82" y="372" font-size="24" fill="#203b35" font-weight="400">using a common reference.</text><rect x="82" y="423" width="404" height="68" rx="10" fill="#e4eddf" stroke="#e4eddf"/><text x="103" y="465" font-size="25" fill="#315f4d" font-weight="600">Reference / control</text><text x="82" y="552" font-size="23" fill="#65766d" font-weight="400">Source text and captions can</text><text x="82" y="592" font-size="23" fill="#65766d" font-weight="400">provide lookup links.</text><text x="82" y="729" font-size="22" fill="#315f4d" font-weight="600">Keep the reading context</text><path d="M518 456H553" stroke="#315f4d" stroke-width="3"/><path d="M541 445L552 456L541 467" stroke="#315f4d" fill="none" stroke-width="3"/><circle cx="602" cy="260" r="17" fill="#315f4d"/><text x="596" y="266" font-size="18" fill="white" font-weight="600">2</text><text x="631" y="269" font-size="24" fill="#315f4d" font-weight="600">Open the concept card</text><rect x="584" y="300" width="774" height="79" rx="10" fill="#f5f5ef" stroke="#d4ddd2"/><text x="610" y="348" font-size="26" fill="#203b35" font-weight="600">Reference: what makes a comparison meaningful?</text><text x="608" y="426" font-size="22" fill="#315f4d" font-weight="600">What it is</text><text x="608" y="467" font-size="22" fill="#203b35" font-weight="400">A reference gives a measurement something to be compared with.</text><text x="608" y="530" font-size="22" fill="#315f4d" font-weight="600">How this paper uses it</text><text x="608" y="571" font-size="22" fill="#203b35" font-weight="400">A and B share a scale in this demo. The actual paper still</text><text x="608" y="607" font-size="22" fill="#203b35" font-weight="400">needs its own conditions and evidence checked.</text><rect x="608" y="663" width="706" height="69" rx="10" fill="#e4eddf" stroke="#e4eddf"/><text x="633" y="706" font-size="23" fill="#315f4d" font-weight="600">Return to the previous panel and reading position</text>
<path d="M52 884H1388" stroke="#d4ddd2"/>
<text x="52" y="925" font-size="18" fill="#65766d" font-weight="400">Example concept only; selection depends on the paper and its readers.</text>
<text x="1135" y="55" font-size="17" fill="#315f4d" font-weight="600">FEATURE DEMO</text>
</g></svg>