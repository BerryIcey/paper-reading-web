<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">术语知识卡：补足理解，再回到刚才的位置</title><desc id="desc">解释概念本身和本文用途；临时查阅有来路，也有返回位置。 概念仅用于示意；哪些词需要查阅，依据当前文章与读者背景判断。</desc>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<rect x="0" y="0" width="1440" height="960" rx="24" fill="#f5f5ef" stroke="#f5f5ef"/>
<text x="52" y="55" font-size="18" fill="#65766d" font-weight="600">PAPER TO HTML  /  02</text>
<text x="52" y="109" font-size="38" fill="#203b35" font-weight="700">术语知识卡：补足理解，再回到刚才的位置</text>
<text x="52" y="155" font-size="23" fill="#65766d" font-weight="400">解释概念本身和本文用途；临时查阅有来路，也有返回位置。</text>
<rect x="52" y="215" width="465" height="602" rx="14" fill="white" stroke="#d4ddd2"/><rect x="555" y="215" width="833" height="602" rx="14" fill="white" stroke="#d4ddd2"/><circle cx="99" cy="260" r="17" fill="#315f4d"/><text x="93" y="266" font-size="18" fill="white" font-weight="600">1</text><text x="128" y="269" font-size="24" fill="#315f4d" font-weight="600">正文中的查阅入口</text><text x="82" y="330" font-size="24" fill="#203b35" font-weight="400">两组使用共同参照进行比较。</text><text x="82" y="372" font-size="24" fill="#203b35" font-weight="400">读到陌生概念时，按需查阅。</text><rect x="82" y="423" width="404" height="68" rx="10" fill="#e4eddf" stroke="#e4eddf"/><text x="103" y="465" font-size="25" fill="#315f4d" font-weight="600">参照 / 对照</text><text x="82" y="552" font-size="23" fill="#65766d" font-weight="400">原文、译文与图注</text><text x="82" y="592" font-size="23" fill="#65766d" font-weight="400">都可提供适当查阅入口。</text><text x="82" y="729" font-size="22" fill="#315f4d" font-weight="600">不丢当前小图与阅读位置</text><path d="M518 456H553" stroke="#315f4d" stroke-width="3"/><path d="M541 445L552 456L541 467" stroke="#315f4d" fill="none" stroke-width="3"/><circle cx="602" cy="260" r="17" fill="#315f4d"/><text x="596" y="266" font-size="18" fill="white" font-weight="600">2</text><text x="631" y="269" font-size="24" fill="#315f4d" font-weight="600">打开有条理的知识卡</text><rect x="584" y="300" width="774" height="79" rx="10" fill="#f5f5ef" stroke="#d4ddd2"/><text x="610" y="348" font-size="26" fill="#203b35" font-weight="600">参照：这项比较为什么可以放在一起读？</text><text x="608" y="426" font-size="22" fill="#315f4d" font-weight="600">先建立认识</text><text x="608" y="467" font-size="22" fill="#203b35" font-weight="400">参照为测量值提供比较基础；先说清对象和量尺。</text><text x="608" y="530" font-size="22" fill="#315f4d" font-weight="600">再联系本文场景</text><text x="608" y="571" font-size="22" fill="#203b35" font-weight="400">演示中 A 与 B 使用同一尺度，柱高才可比较。</text><text x="608" y="607" font-size="22" fill="#203b35" font-weight="400">实际论文还需核对背景、干预与统计，不能直接套用。</text><rect x="608" y="663" width="706" height="69" rx="10" fill="#e4eddf" stroke="#e4eddf"/><text x="633" y="706" font-size="23" fill="#315f4d" font-weight="600">↩ 查完返回原来的面板和文字位置</text>
<path d="M52 884H1388" stroke="#d4ddd2"/>
<text x="52" y="925" font-size="18" fill="#65766d" font-weight="400">概念仅用于示意；哪些词需要查阅，依据当前文章与读者背景判断。</text>
<text x="1135" y="55" font-size="17" fill="#315f4d" font-weight="600">FEATURE DEMO</text>
</g></svg>