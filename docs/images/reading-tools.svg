<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">附加阅读工具：查类别、做标记、留下问题</title><desc id="desc">辅助阅读操作，与理解正文、知识卡和论证链配合使用。 功能示意，并非界面截图；项目随手记保存需要本地服务。</desc>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<rect x="0" y="0" width="1440" height="960" rx="24" fill="#f5f5ef" stroke="#f5f5ef"/>
<text x="52" y="55" font-size="18" fill="#65766d" font-weight="600">PAPER TO HTML  /  04</text>
<text x="52" y="109" font-size="38" fill="#203b35" font-weight="700">附加阅读工具：查类别、做标记、留下问题</text>
<text x="52" y="155" font-size="23" fill="#65766d" font-weight="400">辅助阅读操作，与理解正文、知识卡和论证链配合使用。</text>
<rect x="52" y="221" width="428" height="597" rx="14" fill="white" stroke="#d4ddd2"/><circle cx="93" cy="264" r="17" fill="#315f4d"/><text x="87" y="270" font-size="18" fill="white" font-weight="600">1</text><text x="122" y="273" font-size="24" fill="#315f4d" font-weight="600">术语图例</text><text x="76" y="335" font-size="22" fill="#65766d" font-weight="400">术语彩色：开启 / 关闭</text><rect x="76" y="380" width="172" height="48" rx="8" fill="#f0dce0" stroke="#f0dce0"/><text x="95" y="412" font-size="22" fill="#203b35" font-weight="400">对象</text><rect x="267" y="380" width="172" height="48" rx="8" fill="#dce8f5" stroke="#dce8f5"/><text x="286" y="412" font-size="22" fill="#203b35" font-weight="400">实体</text><rect x="76" y="445" width="172" height="48" rx="8" fill="#e8e0ef" stroke="#e8e0ef"/><text x="95" y="477" font-size="22" fill="#203b35" font-weight="400">过程</text><rect x="267" y="445" width="172" height="48" rx="8" fill="#e0e7ed" stroke="#e0e7ed"/><text x="286" y="477" font-size="22" fill="#203b35" font-weight="400">方法</text><rect x="76" y="510" width="172" height="48" rx="8" fill="#f7ebca" stroke="#f7ebca"/><text x="95" y="542" font-size="22" fill="#203b35" font-weight="400">指标</text><rect x="267" y="510" width="172" height="48" rx="8" fill="#deebe2" stroke="#deebe2"/><text x="286" y="542" font-size="22" fill="#203b35" font-weight="400">结构</text><text x="76" y="656" font-size="21" fill="#65766d" font-weight="400">辅助识别网页术语类别。</text><text x="76" y="694" font-size="21" fill="#65766d" font-weight="400">原图颜色按各图单独解释。</text><rect x="505" y="221" width="428" height="597" rx="14" fill="white" stroke="#d4ddd2"/><circle cx="546" cy="264" r="17" fill="#315f4d"/><text x="540" y="270" font-size="18" fill="white" font-weight="600">2</text><text x="575" y="273" font-size="24" fill="#315f4d" font-weight="600">荧光笔</text><rect x="529" y="328" width="114" height="45" rx="8" fill="#315f4d" stroke="#315f4d"/><text x="548" y="358" font-size="21" fill="white" font-weight="400">开启</text><rect x="659" y="328" width="111" height="45" rx="8" fill="#f5f5ef" stroke="#d4ddd2"/><text x="679" y="358" font-size="21" fill="#203b35" font-weight="400">撤销</text><rect x="529" y="414" width="380" height="136" rx="10" fill="#f5f5ef" stroke="#d4ddd2"/><text x="547" y="453" font-size="21" fill="#203b35" font-weight="400">把需要回看的证据和问题</text><rect x="543" y="466" width="338" height="37" rx="3" fill="#f6df87" stroke="#f6df87"/><text x="547" y="492" font-size="21" fill="#203b35" font-weight="400">留在阅读中的相应位置。</text><text x="529" y="656" font-size="21" fill="#65766d" font-weight="400">主动开启，支持撤销。</text><text x="529" y="694" font-size="21" fill="#65766d" font-weight="400">个人标黄与术语颜色独立。</text><rect x="958" y="221" width="428" height="597" rx="14" fill="white" stroke="#d4ddd2"/><circle cx="999" cy="264" r="17" fill="#315f4d"/><text x="993" y="270" font-size="18" fill="white" font-weight="600">3</text><text x="1028" y="273" font-size="24" fill="#315f4d" font-weight="600">随手记</text><rect x="982" y="328" width="380" height="224" rx="10" fill="#f5f5ef" stroke="#d4ddd2"/><text x="1001" y="371" font-size="23" fill="#203b35" font-weight="600">留给下一轮的问题</text><text x="1001" y="423" font-size="22" fill="#65766d" font-weight="400">这一步的比较为什么能</text><text x="1001" y="461" font-size="22" fill="#65766d" font-weight="400">支持作者的判断？</text><rect x="982" y="578" width="380" height="47" rx="8" fill="#e4eddf" stroke="#e4eddf"/><text x="1001" y="610" font-size="22" fill="#315f4d" font-weight="600">保存到本地项目</text><text x="982" y="680" font-size="21" fill="#65766d" font-weight="400">供下一轮助手读取。</text><text x="982" y="718" font-size="21" fill="#65766d" font-weight="400">不是即时 GPT 回复。</text>
