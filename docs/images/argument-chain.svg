<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">全文论证链：串起证据，也解释每条连接的理由</title><desc id="desc">看清已经知道什么、哪里仍不足，以及下一步为何合适。 用模拟观察展示论证方式；正式阅读需要按当前论文重建证据与理由。</desc>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<rect x="0" y="0" width="1440" height="960" rx="24" fill="#f5f5ef" stroke="#f5f5ef"/>
<text x="52" y="55" font-size="18" fill="#65766d" font-weight="600">PAPER TO HTML  /  03</text>
<text x="52" y="109" font-size="38" fill="#203b35" font-weight="700">全文论证链：串起证据，也解释每条连接的理由</text>
<text x="52" y="155" font-size="23" fill="#65766d" font-weight="400">看清已经知道什么、哪里仍不足，以及下一步为何合适。</text>
<rect x="52" y="213" width="890" height="125" rx="14" fill="white" stroke="#d4ddd2"/><text x="82" y="256" font-size="21" fill="#315f4d" font-weight="600">01</text><text x="139" y="256" font-size="25" fill="#203b35" font-weight="600">提出问题</text><text x="139" y="301" font-size="25" fill="#203b35" font-weight="400">A 与 B 是否不同？</text><path d="M493 338V410" stroke="#8da891" stroke-width="2"/><path d="M487 402L493 411L499 402" fill="none" stroke="#8da891" stroke-width="2"/><rect x="110" y="356" width="765" height="45" rx="4" fill="#f5f5ef" stroke="#f5f5ef"/><text x="132" y="386" font-size="22" fill="#315f4d" font-weight="400">先建立同一尺度的比较，明确对象和参照。</text><rect x="52" y="423" width="890" height="125" rx="14" fill="white" stroke="#d4ddd2"/><text x="82" y="466" font-size="21" fill="#315f4d" font-weight="600">02</text><text x="139" y="466" font-size="25" fill="#203b35" font-weight="600">得到观察</text><text x="139" y="511" font-size="25" fill="#203b35" font-weight="400">这次比较中，A 的测量值更高。</text><path d="M493 548V620" stroke="#8da891" stroke-width="2"/><path d="M487 612L493 621L499 612" fill="none" stroke="#8da891" stroke-width="2"/><rect x="110" y="566" width="765" height="45" rx="4" fill="#f5f5ef" stroke="#f5f5ef"/><text x="132" y="596" font-size="22" fill="#315f4d" font-weight="400">观察到差异，还没有解释差异是否稳定、由什么造成。</text><rect x="52" y="633" width="890" height="125" rx="14" fill="white" stroke="#d4ddd2"/><text x="82" y="676" font-size="21" fill="#315f4d" font-weight="600">03</text><text x="139" y="676" font-size="25" fill="#203b35" font-weight="600">寻找下一证据</text><text x="139" y="721" font-size="25" fill="#203b35" font-weight="400">检查差异是否稳定，以及可能原因。</text><rect x="980" y="213" width="408" height="545" rx="14" fill="#e4eddf" stroke="#e4eddf"/><text x="1010" y="264" font-size="26" fill="#315f4d" font-weight="600">连接里要说清楚</text><text x="1010" y="324" font-size="23" fill="#203b35" font-weight="400">这一步已经知道什么？</text><text x="1010" y="388" font-size="23" fill="#203b35" font-weight="400">仍有哪些问题没回答？</text><text x="1010" y="452" font-size="23" fill="#203b35" font-weight="400">为什么选下一种方法？</text><text x="1010" y="516" font-size="23" fill="#203b35" font-weight="400">结果怎样改变判断？</text><text x="1010" y="648" font-size="21" fill="#65766d" font-weight="400">保留并行证据、否定结果</text><text x="1010" y="685" font-size="21" fill="#65766d" font-weight="400">和尚未解决的分支。</text><text x="52" y="837" font-size="23" fill="#65766d" font-weight="400">研究顺序不等于事件发生顺序；箭头也不能替代因果证据。</text>
<path d="M52 884H1388" stroke="#d4ddd2"/>
<text x="52" y="925" font-size="18" fill="#65766d" font-weight="400">用模拟观察展示论证方式；正式阅读需要按当前论文重建证据与理由。</text>
<text x="1135" y="55" font-size="17" fill="#315f4d" font-weight="600">FEATURE DEMO</text>
</g></svg>