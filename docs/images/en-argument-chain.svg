<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">The argument: connect evidence with reasons</title><desc id="desc">A map of questions and evidence, rather than a list of figure titles. Illustrative argument using simulated findings; rebuild from each paper.</desc>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<rect x="0" y="0" width="1440" height="960" rx="24" fill="#f5f5ef" stroke="#f5f5ef"/>
<text x="52" y="55" font-size="18" fill="#65766d" font-weight="600">PAPER TO HTML  /  03</text>
<text x="52" y="109" font-size="38" fill="#203b35" font-weight="700">The argument: connect evidence with reasons</text>
<text x="52" y="155" font-size="23" fill="#65766d" font-weight="400">A map of questions and evidence, rather than a list of figure titles.</text>
<rect x="52" y="213" width="890" height="125" rx="14" fill="white" stroke="#d4ddd2"/><text x="82" y="256" font-size="21" fill="#315f4d" font-weight="600">01</text><text x="139" y="256" font-size="25" fill="#203b35" font-weight="600">Question</text><text x="139" y="301" font-size="25" fill="#203b35" font-weight="400">Do A and B differ?</text><path d="M493 338V410" stroke="#8da891" stroke-width="2"/><path d="M487 402L493 411L499 402" fill="none" stroke="#8da891" stroke-width="2"/><rect x="110" y="356" width="765" height="45" rx="4" fill="#f5f5ef" stroke="#f5f5ef"/><text x="132" y="386" font-size="22" fill="#315f4d" font-weight="400">Use the same scale and define the comparison.</text><rect x="52" y="423" width="890" height="125" rx="14" fill="white" stroke="#d4ddd2"/><text x="82" y="466" font-size="21" fill="#315f4d" font-weight="600">02</text><text x="139" y="466" font-size="25" fill="#203b35" font-weight="600">Observation</text><text x="139" y="511" font-size="25" fill="#203b35" font-weight="400">A is higher in this comparison.</text><path d="M493 548V620" stroke="#8da891" stroke-width="2"/><path d="M487 612L493 621L499 612" fill="none" stroke="#8da891" stroke-width="2"/><rect x="110" y="566" width="765" height="45" rx="4" fill="#f5f5ef" stroke="#f5f5ef"/><text x="132" y="596" font-size="22" fill="#315f4d" font-weight="400">A difference does not yet explain stability or cause.</text><rect x="52" y="633" width="890" height="125" rx="14" fill="white" stroke="#d4ddd2"/><text x="82" y="676" font-size="21" fill="#315f4d" font-weight="600">03</text><text x="139" y="676" font-size="25" fill="#203b35" font-weight="600">Next evidence</text><text x="139" y="721" font-size="25" fill="#203b35" font-weight="400">Check stability and possible causes.</text><rect x="980" y="213" width="408" height="545" rx="14" fill="#e4eddf" stroke="#e4eddf"/><text x="1010" y="264" font-size="26" fill="#315f4d" font-weight="600">What the links explain</text><text x="1010" y="324" font-size="23" fill="#203b35" font-weight="400">What do we know?</text><text x="1010" y="388" font-size="23" fill="#203b35" font-weight="400">What remains unanswered?</text><text x="1010" y="452" font-size="23" fill="#203b35" font-weight="400">Why this next approach?</text><text x="1010" y="516" font-size="23" fill="#203b35" font-weight="400">How does the result help?</text><text x="1010" y="648" font-size="21" fill="#65766d" font-weight="400">Keep parallel evidence</text><text x="1010" y="685" font-size="21" fill="#65766d" font-weight="400">and unresolved branches.</text><text x="52" y="837" font-size="23" fill="#65766d" font-weight="400">Research order alone does not establish chronology or causation.</text>
<path d="M52 884H1388" stroke="#d4ddd2"/>
<text x="52" y="925" font-size="18" fill="#65766d" font-weight="400">Illustrative argument using simulated findings; rebuild from each paper.</text>
<text x="1135" y="55" font-size="17" fill="#315f4d" font-weight="600">FEATURE DEMO</text>
</g></svg>