<text x="52" y="55" font-size="18" fill="#65766d" font-weight="600">PAPER TO HTML  /  04</text>
<text x="52" y="109" font-size="38" fill="#203b35" font-weight="700">Supporting tools for a smoother read</text>
<text x="52" y="155" font-size="23" fill="#65766d" font-weight="400">Useful companions to the walkthrough, concepts and argument map.</text>
<rect x="52" y="221" width="428" height="597" rx="14" fill="white" stroke="#d4ddd2"/><circle cx="93" cy="264" r="17" fill="#315f4d"/><text x="87" y="270" font-size="18" fill="white" font-weight="600">1</text><text x="122" y="273" font-size="24" fill="#315f4d" font-weight="600">Term legend</text><text x="76" y="335" font-size="22" fill="#65766d" font-weight="400">Colors: On / Off</text><rect x="76" y="380" width="172" height="48" rx="8" fill="#f0dce0" stroke="#f0dce0"/><text x="95" y="412" font-size="22" fill="#203b35" font-weight="400">Objects</text><rect x="267" y="380" width="172" height="48" rx="8" fill="#dce8f5" stroke="#dce8f5"/><text x="286" y="412" font-size="22" fill="#203b35" font-weight="400">Entities</text><rect x="76" y="445" width="172" height="48" rx="8" fill="#e8e0ef" stroke="#e8e0ef"/><text x="95" y="477" font-size="22" fill="#203b35" font-weight="400">Processes</text><rect x="267" y="445" width="172" height="48" rx="8" fill="#e0e7ed" stroke="#e0e7ed"/><text x="286" y="477" font-size="22" fill="#203b35" font-weight="400">Methods</text><rect x="76" y="510" width="172" height="48" rx="8" fill="#f7ebca" stroke="#f7ebca"/><text x="95" y="542" font-size="22" fill="#203b35" font-weight="400">Metrics</text><rect x="267" y="510" width="172" height="48" rx="8" fill="#deebe2" stroke="#deebe2"/><text x="286" y="542" font-size="22" fill="#203b35" font-weight="400">Structures</text><text x="76" y="656" font-size="21" fill="#65766d" font-weight="400">Read webpage categories.</text><text x="76" y="694" font-size="21" fill="#65766d" font-weight="400">Figure legends remain separate.</text><rect x="505" y="221" width="428" height="597" rx="14" fill="white" stroke="#d4ddd2"/><circle cx="546" cy="264" r="17" fill="#315f4d"/><text x="540" y="270" font-size="18" fill="white" font-weight="600">2</text><text x="575" y="273" font-size="24" fill="#315f4d" font-weight="600">Highlighter</text><rect x="529" y="328" width="114" height="45" rx="8" fill="#315f4d" stroke="#315f4d"/><text x="548" y="358" font-size="21" fill="white" font-weight="400">Enable</text><rect x="659" y="328" width="111" height="45" rx="8" fill="#f5f5ef" stroke="#d4ddd2"/><text x="679" y="358" font-size="21" fill="#203b35" font-weight="400">Undo</text><rect x="529" y="414" width="380" height="136" rx="10" fill="#f5f5ef" stroke="#d4ddd2"/><text x="547" y="453" font-size="21" fill="#203b35" font-weight="400">Mark the evidence you want</text><rect x="543" y="466" width="338" height="37" rx="3" fill="#f6df87" stroke="#f6df87"/><text x="547" y="492" font-size="21" fill="#203b35" font-weight="400">to return to while reading.</text><text x="529" y="656" font-size="21" fill="#65766d" font-weight="400">An explicit switch and undo.</text><text x="529" y="694" font-size="21" fill="#65766d" font-weight="400">Separate from term colors.</text><rect x="958" y="221" width="428" height="597" rx="14" fill="white" stroke="#d4ddd2"/><circle cx="999" cy="264" r="17" fill="#315f4d"/><text x="993" y="270" font-size="18" fill="white" font-weight="600">3</text><text x="1028" y="273" font-size="24" fill="#315f4d" font-weight="600">Notes</text><rect x="982" y="328" width="380" height="224" rx="10" fill="#f5f5ef" stroke="#d4ddd2"/><text x="1001" y="371" font-size="23" fill="#203b35" font-weight="600">Question for later</text><text x="1001" y="423" font-size="22" fill="#65766d" font-weight="400">Which comparison supports</text><text x="1001" y="461" font-size="22" fill="#65766d" font-weight="400">this conclusion?</text><rect x="982" y="578" width="380" height="47" rx="8" fill="#e4eddf" stroke="#e4eddf"/><text x="1001" y="610" font-size="22" fill="#315f4d" font-weight="600">Save to the local project</text><text x="982" y="680" font-size="21" fill="#65766d" font-weight="400">Read by a later assistant session.</text><text x="982" y="718" font-size="21" fill="#65766d" font-weight="400">Not an instant GPT response.</text>
