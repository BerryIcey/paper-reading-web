<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">Supporting tools for a smoother read</title><desc id="desc">Useful companions to the walkthrough, concepts and argument map. Feature illustration, not a UI screenshot. Project notes require the local service.</desc>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
