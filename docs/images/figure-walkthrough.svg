<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">逐图带读：从图上的观察，走到有依据的判断</title><desc id="desc">先说清问题与比较，再读实际结果；原图和对应讲解同步切换。 功能示意与模拟数据；展示讲解方式，不是实际论文结果或界面截图。</desc>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<rect x="0" y="0" width="1440" height="960" rx="24" fill="#f5f5ef" stroke="#f5f5ef"/>
<text x="52" y="55" font-size="18" fill="#65766d" font-weight="600">PAPER TO HTML  /  01</text>
<text x="52" y="109" font-size="38" fill="#203b35" font-weight="700">逐图带读：从图上的观察，走到有依据的判断</text>
<text x="52" y="155" font-size="23" fill="#65766d" font-weight="400">先说清问题与比较，再读实际结果；原图和对应讲解同步切换。</text>
<rect x="52" y="203" width="1336" height="641" rx="14" fill="white" stroke="#d4ddd2"/><rect x="80" y="230" width="102" height="46" rx="12" fill="#315f4d" stroke="#315f4d"/><text x="103" y="261" font-size="21" fill="white" font-weight="600">面板 a</text><rect x="195" y="230" width="92" height="46" rx="12" fill="#f5f5ef" stroke="#d4ddd2"/><text x="218" y="261" font-size="21" fill="#65766d" font-weight="400">b</text><text x="321" y="261" font-size="22" fill="#65766d" font-weight="400">当前原图与讲解一起切换</text><rect x="80" y="300" width="505" height="512" rx="12" fill="#f5f5ef" stroke="#d4ddd2"/><text x="108" y="344" font-size="25" fill="#203b35" font-weight="600">同一尺度下的测量值</text><path d="M144 408V672H542" fill="none" stroke="#899b8d" stroke-width="2"/><path d="M144 672H542" stroke="#dbe2d7"/><text x="106" y="678" font-size="19" fill="#65766d" font-weight="400">0</text><path d="M144 582H542" stroke="#dbe2d7"/><text x="106" y="588" font-size="19" fill="#65766d" font-weight="400">20</text><path d="M144 492H542" stroke="#dbe2d7"/><text x="106" y="498" font-size="19" fill="#65766d" font-weight="400">40</text><path d="M144 402H542" stroke="#dbe2d7"/><text x="106" y="408" font-size="19" fill="#65766d" font-weight="400">60</text><rect x="200" y="402" width="103" height="270" rx="3" fill="#cf8967" stroke="#cf8967"/><rect x="365" y="514" width="103" height="158" rx="3" fill="#729aae" stroke="#729aae"/><text x="230" y="389" font-size="24" fill="#203b35" font-weight="600">60</text><text x="393" y="501" font-size="24" fill="#203b35" font-weight="600">35</text><text x="235" y="711" font-size="24" fill="#203b35" font-weight="400">A</text><text x="403" y="711" font-size="24" fill="#203b35" font-weight="400">B</text><text x="108" y="769" font-size="19" fill="#65766d" font-weight="400">模拟数值 · 不是真实论文结果</text><circle cx="637" cy="331" r="17" fill="#315f4d"/><text x="631" y="337" font-size="18" fill="white" font-weight="600">1</text><text x="666" y="340" font-size="24" fill="#315f4d" font-weight="600">作者现在要回答什么？</text><text x="666" y="381" font-size="22" fill="#203b35" font-weight="400">比较 A 与 B 在同一测量量上的差异。</text><text x="666" y="417" font-size="22" fill="#203b35" font-weight="400">每根柱是组汇总值，先确定它代表谁。</text><circle cx="637" cy="481" r="17" fill="#315f4d"/><text x="631" y="487" font-size="18" fill="white" font-weight="600">2</text><text x="666" y="490" font-size="24" fill="#315f4d" font-weight="600">指着一个实际结果读</text><text x="666" y="531" font-size="22" fill="#203b35" font-weight="400">橙色 A 为 60，蓝色 B 为 35。</text><text x="666" y="567" font-size="22" fill="#203b35" font-weight="400">先对应组别和量尺，再读取高低方向。</text><rect x="620" y="625" width="733" height="133" rx="12" fill="#e4eddf" stroke="#e4eddf"/><circle cx="657" cy="657" r="17" fill="#315f4d"/><text x="651" y="663" font-size="18" fill="white" font-weight="600">3</text><text x="686" y="666" font-size="24" fill="#315f4d" font-weight="600">从观察能判断什么？</text><text x="686" y="707" font-size="22" fill="#203b35" font-weight="400">这里 A 高于 B；但差异是否稳定、为何产生，</text><text x="686" y="740" font-size="22" fill="#203b35" font-weight="400">仍需要更多证据，不能仅凭两根柱作因果判断。</text><text x="620" y="796" font-size="20" fill="#65766d" font-weight="400">图注、简短结论与详细讲解分别保留</text>
<path d="M52 884H1388" stroke="#d4ddd2"/>
<text x="52" y="925" font-size="18" fill="#65766d" font-weight="400">功能示意与模拟数据；展示讲解方式，不是实际论文结果或界面截图。</text>
<text x="1135" y="55" font-size="17" fill="#315f4d" font-weight="600">FEATURE DEMO</text>
</g></svg>