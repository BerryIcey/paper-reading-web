="666" y="340" font-size="24" fill="#315f4d" font-weight="600">Why this comparison?</text><text x="666" y="381" font-size="22" fill="#203b35" font-weight="400">Compare A and B on the same scale.</text><text x="666" y="417" font-size="22" fill="#203b35" font-weight="400">One bar summarizes one group.</text><circle cx="637" cy="481" r="17" fill="#315f4d"/><text x="631" y="487" font-size="18" fill="white" font-weight="600">2</text><text x="666" y="490" font-size="24" fill="#315f4d" font-weight="600">Read one visible observation</text><text x="666" y="531" font-size="22" fill="#203b35" font-weight="400">Orange is A (60); blue is B (35).</text><text x="666" y="567" font-size="22" fill="#203b35" font-weight="400">Identify the labels before reading height.</text><rect x="620" y="625" width="733" height="133" rx="12" fill="#e4eddf" stroke="#e4eddf"/><circle cx="657" cy="657" r="17" fill="#315f4d"/><text x="651" y="663" font-size="18" fill="white" font-weight="600">3</text><text x="686" y="666" font-size="24" fill="#315f4d" font-weight="600">What does it support?</text><text x="686" y="707" font-size="22" fill="#203b35" font-weight="400">A is higher here. Stability and cause need</text><text x="686" y="740" font-size="22" fill="#203b35" font-weight="400">further evidence, not just these two bars.</text><text x="620" y="796" font-size="20" fill="#65766d" font-weight="400">Caption · conclusion · detailed explanation</text>
