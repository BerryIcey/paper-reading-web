<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>论文共读组件</title><link rel="stylesheet" href="reader.css"></head><body data-paper-id="replace-with-unique-paper-id"><nav id="reader-nav" aria-label="正文目录"></nav><main id="reader-content"><!--由论文内容替换：section[data-section]与稳定id；图文面板按components.md生成--></main>
<button id="reader-return" class="reader-return" hidden>↩ 回到刚才阅读处</button>
<div class="reader-dock"><div class="reader-dock-row"><button id="reader-pen" aria-expanded="false" aria-label="展开荧光笔">✏️</button><div id="reader-pen-tools" class="reader-tools" hidden><button id="reader-pen-enable" aria-pressed="false">开启</button><button id="reader-undo">撤销</button></div><button id="reader-legend-toggle" aria-expanded="true">图例</button></div><div id="reader-legend" class="reader-legend"><button id="reader-color-toggle" aria-pressed="true">术语彩色：开启</button><div class="reader-legend-grid"><span class="term-disease">◆ 病 疾病/研究组</span><span class="term-gene">■ 基 基因</span><span class="term-protein">● 蛋 蛋白</span><span class="term-phenotype">● 表 分子表型</span><span class="term-method">▰ 法 实验方法</span><span class="term-structure">▲ 结构 DNA/结构</span></div></div></div>

<button id="reader-notes-toggle" class="reader-notes-toggle" aria-expanded="false">随手记</button><aside id="reader-notes" class="reader-notes" hidden><h2>随手记 · 随手问</h2><p class="reader-status">问题保存到当前论文项目，下轮共读时处理。</p><select id="reader-note-kind" aria-label="记录类型"><option value="question">我有疑问</option><option value="addition">补充内容</option><option value="change">修改要求</option></select><select id="reader-note-section" aria-label="放在哪一块"></select><textarea id="reader-draft" placeholder="想到什么就写什么，可粘贴截图" aria-label="问题或要求"></textarea><input id="reader-files" type="file" accept="image/png,image/jpeg,image/webp" multiple><div id="reader-attachments"></div><button id="reader-attachments-clear">清除截图</button><button id="reader-note-save" disabled>存下这条 · 下轮处理</button><button id="reader-note-cancel">退出编辑</button><p id="reader-note-status" class="reader-status" role="status"></p><button id="reader-note-refresh">刷新记录</button><div id="reader-note-list"></div></aside>
<dialog id="reader-zoom" class="reader-zoom"><div class="reader-zoom-tools"><button id="reader-zoom-plus">＋</button><button id="reader-zoom-minus">−</button><button id="reader-zoom-reset">复位</button></div><button id="reader-zoom-close" aria-label="关闭图片预览" title="关闭图片预览">×</button><div id="reader-zoom-stage" class="reader-zoom-stage"><img id="reader-zoom-image" alt="当前放大图"></div></dialog><script src="reader.js"></script></body></html>
